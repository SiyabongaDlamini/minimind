[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "minimind"
version = "0.2.0"
description = "Lightweight Vision-Language Model, Multimodal Search, and Neural Network Engine in pure NumPy."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Minimind contributors" }]
keywords = [
    "vision-language-model",
    "vlm",
    "multimodal",
    "neural-network",
    "numpy",
    "machine-learning",
    "zero-shot",
    "rag",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
image = ["pillow>=10.0"]
viz = ["matplotlib>=3.7", "pillow>=10.0"]
demo = ["scikit-learn>=1.3"]
docs = ["pypdf>=4.0"]
all = ["minimind[image,viz,demo,docs]"]
dev = ["minimind[all]", "pytest>=7.4", "ruff>=0.4"]

[project.scripts]
minimind = "minimind.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/minimind"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
