[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "minimind"
version = "0.1.0"
description = "A small, readable neural network in pure NumPy, with image/CSV parsers and live matplotlib training animations."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Minimind contributors" }]
keywords = ["neural-network", "numpy", "machine-learning", "education", "matplotlib"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
image = ["pillow>=10.0"]
viz = ["matplotlib>=3.7", "pillow>=10.0"]
demo = ["scikit-learn>=1.3"]
docs = ["pypdf>=4.0"]
all = ["minimind[image,viz,demo,docs]"]
dev = ["minimind[all]", "pytest>=7.4", "ruff>=0.4"]

[project.scripts]
minimind = "minimind.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/minimind"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
